# Engineer's Focus Theme
# Based on Tokyo Night - The choice of professionals.

# Background: Deep Night (Not black, but a rich, dark blue-grey)
background #1a1b26
# Foreground: Storm Cloud White
foreground #a9b1d6

# Selection: Highlight Blue
selection_background #33467c
selection_foreground #c0caf5

# Cursor: Electric Line
cursor #c0caf5
cursor_text_color #1a1b26

# URL: Link Blue
url_color #73daca
url_style straight

# Border
active_border_color #7aa2f7
inactive_border_color #292e42

# Tab Bar
tab_bar_style fade
active_tab_foreground   #1d2021
active_tab_background   #7aa2f7
inactive_tab_foreground #c0caf5
inactive_tab_background #292e42

# Color Palette (Pastel & High Contrast where needed)

# Black
color0 #15161e
color8 #414868

# Red (Errors)
color1 #f7768e
color9 #f7768e

# Green (Success/String)
color2 #9ece6a
color10 #9ece6a

# Yellow (Warning)
color3 #e0af68
color11 #e0af68

# Blue (Functions)
color4 #7aa2f7
color12 #7aa2f7

# Magenta (Keywords)
color5 #bb9af7
color13 #bb9af7

# Cyan (Special)
color6 #7dcfff
color14 #7dcfff

# White
color7 #a9b1d6
color15 #c0caf5
